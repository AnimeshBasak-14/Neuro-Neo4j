[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuro-neo4j"
version = "0.1.0"
description = "Hybrid Graph Database and Explainable GNN Pipeline for Brain Biomarker Discovery"
authors = [{name = "basakanimesh14"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "neo4j>=5.14",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # "node2vec>=0.4",  # Optional: requires gensim (C extension, Python 3.14 incompatible)
                         # Install manually if on Python ≤3.12: pip install node2vec
    "networkx>=3.1",
    "tqdm>=4.66",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["models", "api", "monitoring", "validation"]
