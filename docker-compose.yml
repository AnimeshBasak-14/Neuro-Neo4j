version: "3.9"

# ================================================================
# Neuro-Neo4j — Local Development Stack
# ================================================================
# Start:   docker compose up -d
# Stop:    docker compose down
# Logs:    docker compose logs -f neo4j
# Browser: http://localhost:7474  (neo4j / neuro_password)
# ================================================================

services:
  neo4j:
    image: neo4j:5.15
    container_name: neuro_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/neuro_password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2g"
      NEO4J_dbms_memory_pagecache_size: "512m"
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - ./data/processed:/var/lib/neo4j/import/data
      - ./neo4j_layer/schema:/var/lib/neo4j/import/schema
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neuro_password 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
